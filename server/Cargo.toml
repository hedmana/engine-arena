[package]
name = "engine-arena"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
shakmaty = "0.30.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
